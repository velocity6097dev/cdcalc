<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E68B0">
<title>Cash Deposit</title>
<style>
/* ---------- Design tokens ---------- */
:root{
  --page:#DDE6EE; --bg:#F3F6FA; --surface:#FFFFFF; --ink:#0F1F2E; --muted:#5B6F82; --line:#E1E8EF;
  --head-1:#0E68B0; --head-2:#0A4A82; --accent:#FFD60A; --accent-ink:#1B1500;
  --plus-bg:#E5F0FA; --plus-ink:#0B5FA5; --danger:#C0392B; --danger-bg:#FBE9E7; --wa:#1BA455;
  --shadow:0 1px 2px rgba(15,31,46,.06),0 4px 14px rgba(15,31,46,.06);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --page:#050D14; --bg:#0A141D; --surface:#12212F; --ink:#EAF1F7; --muted:#93A9BC; --line:#21364A;
    --head-1:#0F4F83; --head-2:#0A3558; --plus-bg:#14344F; --plus-ink:#7CC0F5;
    --danger:#FF9087; --danger-bg:#3B2023; --shadow:0 1px 2px rgba(0,0,0,.4);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --page:#050D14; --bg:#0A141D; --surface:#12212F; --ink:#EAF1F7; --muted:#93A9BC; --line:#21364A;
  --head-1:#0F4F83; --head-2:#0A3558; --plus-bg:#14344F; --plus-ink:#7CC0F5;
  --danger:#FF9087; --danger-bg:#3B2023; --shadow:0 1px 2px rgba(0,0,0,.4);
  color-scheme:dark;
}

/* ---------- Base ---------- */
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--page);color:var(--ink);overflow:hidden;
  font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--head-1);z-index:10}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* ---------- Layout ---------- */
.app{height:100%;max-width:440px;margin:0 auto;display:flex;flex-direction:column;background:var(--bg);overflow:hidden}
@media (min-width:600px){
  .app{height:calc(100% - 48px);margin:24px auto;border-radius:28px;box-shadow:0 24px 70px rgba(0,30,60,.3)}
}
.top{flex-shrink:0;color:#fff;padding:16px 18px 18px;border-radius:0 0 26px 26px;
  background:linear-gradient(160deg,var(--head-1),var(--head-2));box-shadow:0 8px 24px rgba(8,50,90,.25)}
.top-row{display:flex;justify-content:space-between;align-items:center}
.eyebrow{margin:0;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;opacity:.75}
h1{margin:2px 0 0;font-size:22px;font-weight:800;letter-spacing:-.01em}
.total-card{margin-top:14px;padding:13px 15px;border-radius:18px;display:flex;justify-content:space-between;align-items:flex-end;
  background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18)}
.total-card .lbl{display:block;font-size:12px;font-weight:600;opacity:.8}
#hero-total{display:block;font-size:32px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
#hero-meta{font-size:12.5px;font-weight:600;opacity:.85;padding-bottom:4px}
.date-row{margin-top:12px;display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:600}
.date-row label{opacity:.85}
input[type=date]{appearance:none;-webkit-appearance:none;border:1px solid rgba(255,255,255,.2);border-radius:999px;
  padding:7px 14px;font:inherit;font-weight:700;color:#fff;background:rgba(255,255,255,.14);color-scheme:dark;min-height:36px}
input[type=date]::-webkit-calendar-picker-indicator{filter:invert(1);cursor:pointer}

main{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:18px 16px 10px}
.section-label{margin:0 4px 10px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.cta{flex-shrink:0;padding:12px 16px;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -6px 20px rgba(15,31,46,.06)}
.cta .btn{width:100%;min-height:54px;font-size:16px}

/* ---------- Buttons (class based, so they style everywhere) ---------- */
.btn{appearance:none;-webkit-appearance:none;border:0;margin:0;font:inherit;font-weight:700;cursor:pointer;
  min-height:50px;padding:0 18px;border-radius:14px;display:inline-flex;align-items:center;justify-content:center;gap:8px;
  touch-action:manipulation;user-select:none;transition:transform .08s,filter .15s,opacity .15s}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.45;pointer-events:none}
.btn-primary{background:var(--accent);color:var(--accent-ink);box-shadow:0 2px 0 rgba(0,0,0,.1),0 8px 18px rgba(255,214,10,.25)}
.btn-wa{background:var(--wa);color:#fff;box-shadow:0 8px 18px rgba(27,164,85,.25)}
.btn-soft{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.btn-danger{background:var(--danger);color:#fff}
.btn-ghost{min-height:36px;padding:0 14px;font-size:13px;color:#fff;background:rgba(255,255,255,.16);border-radius:999px}
.icon-btn{appearance:none;-webkit-appearance:none;border:0;width:34px;height:34px;border-radius:50%;font-size:22px;line-height:1;
  background:var(--bg);color:var(--muted);cursor:pointer;touch-action:manipulation}

/* ---------- Place list ---------- */
.place{appearance:none;-webkit-appearance:none;width:100%;margin:0 0 10px;padding:12px 14px;display:flex;align-items:center;gap:13px;
  text-align:left;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:18px;
  box-shadow:var(--shadow);cursor:pointer;touch-action:manipulation;transition:transform .08s}
.place:active{transform:scale(.985)}
.badge{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;background:var(--plus-bg)}
.place-text{flex:1;min-width:0;display:flex;flex-direction:column}
.place-name{font-weight:700;font-size:15.5px}
.place-sub{font-size:12.5px;color:var(--muted);margin-top:1px}
.place-amt{font-weight:800;font-size:17px}
.chev{color:var(--muted);font-size:22px;line-height:1}

/* ---------- Sheets ---------- */
.overlay{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:rgba(4,20,34,.55);
  opacity:0;visibility:hidden;transition:opacity .2s,visibility .2s}
.overlay.open{opacity:1;visibility:visible}
.overlay.center{align-items:center;padding:24px}
.sheet{width:100%;max-width:440px;max-height:92%;display:flex;flex-direction:column;background:var(--surface);
  border-radius:26px 26px 0 0;transform:translateY(28px);transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.overlay.open .sheet{transform:none}
.overlay.center .sheet{border-radius:22px;max-height:none;padding:20px}
.grab{width:38px;height:4px;border-radius:4px;background:var(--line);margin:9px auto 0;flex-shrink:0}
.sheet-head{flex-shrink:0;padding:8px 16px 12px}
.head-row{display:flex;justify-content:space-between;align-items:center}
.sheet h2{margin:0;font-size:19px;font-weight:800}
.sheet-body{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:0 16px 14px}
.sheet-foot{flex-shrink:0;display:flex;gap:10px;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.sheet-foot .btn-primary,.sheet-foot .btn-wa{flex:1}
.strip{margin-top:10px;padding:11px 14px;border-radius:14px;background:var(--bg);display:flex;justify-content:space-between;align-items:center}
.strip-lbl{display:block;font-weight:700}
.strip-sub{font-size:12px;color:var(--muted)}
.strip strong{font-size:23px;color:var(--plus-ink);font-weight:800}

/* ---------- Denomination cards ---------- */
.denom{padding:12px;margin-bottom:10px;border-radius:16px;background:var(--bg);border:1px solid var(--line)}
.denom-top{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.note{min-width:62px;padding:7px 0;text-align:center;border-radius:10px;font-weight:800;font-size:16px;color:var(--accent-ink);background:var(--accent)}
.x{color:var(--muted);font-weight:700}
.qty{appearance:none;-moz-appearance:textfield;width:84px;min-height:42px;padding:0 8px;text-align:center;font:inherit;font-size:18px;font-weight:700;
  color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:11px}
.qty::-webkit-outer-spin-button,.qty::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.qty:focus{border-color:var(--plus-ink);outline:none;box-shadow:0 0 0 3px var(--plus-bg)}
.d-amt{margin-left:auto;font-weight:800;font-size:16px;color:var(--plus-ink)}
.chips{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.chip{appearance:none;-webkit-appearance:none;border:0;min-height:42px;padding:0;border-radius:11px;font:inherit;font-size:13.5px;font-weight:800;
  cursor:pointer;touch-action:manipulation;user-select:none;transition:transform .06s,opacity .15s}
.chip:active{transform:scale(.93)}
.chip.minus{background:var(--danger-bg);color:var(--danger)}
.chip.plus{background:var(--plus-bg);color:var(--plus-ink)}
.chip:disabled{opacity:.35;pointer-events:none}

/* ---------- Summary ---------- */
.summary-date{margin:0;font-size:13px;color:var(--muted)}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}
.list li.empty{color:var(--muted);justify-content:center;border:0}
.grand{display:flex;justify-content:space-between;align-items:baseline;margin:6px 0 16px;padding:14px 0;border-top:2px solid var(--ink)}
.grand span:first-child{font-weight:700}
.grand span:last-child{font-size:28px;font-weight:800;color:var(--plus-ink)}
.sub-h{margin:0 0 4px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.breakdown li{font-size:14.5px;color:var(--muted)}
.confirm p{margin:6px 0 18px;color:var(--muted)}
.confirm .row{display:flex;gap:10px}
.confirm .btn{flex:1}

/* ---------- Toast ---------- */
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:60;max-width:calc(100% - 32px);
  display:flex;align-items:center;gap:14px;padding:11px 16px;border-radius:14px;font-weight:600;font-size:14px;
  color:#fff;background:#14232F;box-shadow:0 10px 30px rgba(0,0,0,.3);
  opacity:0;visibility:hidden;transform:translate(-50%,10px);transition:opacity .2s,transform .2s,visibility .2s}
.toast.show{opacity:1;visibility:visible;transform:translate(-50%,0)}
.toast-undo{appearance:none;-webkit-appearance:none;border:0;background:none;padding:4px 2px;font:inherit;font-weight:800;color:var(--accent);cursor:pointer}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="top-row">
      <div><p class="eyebrow">Daily collection</p><h1>Cash Deposit</h1></div>
      <button id="reset-btn" class="btn btn-ghost" type="button">↺ Clear all</button>
    </div>
    <div class="total-card">
      <div><span class="lbl">Total collected</span><span id="hero-total" class="num">₹0</span></div>
      <span id="hero-meta">0 notes</span>
    </div>
    <div class="date-row"><label for="date-input">Deposit date</label><input type="date" id="date-input"></div>
  </header>

  <main>
    <p class="section-label">Collection points</p>
    <div id="place-list"></div>
  </main>

  <div class="cta">
    <button id="review-btn" class="btn btn-primary" type="button">Review &amp; Send &nbsp;→</button>
  </div>
</div>

<!-- Entry sheet -->
<div class="overlay" id="entry-overlay">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="entry-title">
    <div class="grab"></div>
    <div class="sheet-head">
      <div class="head-row"><h2 id="entry-title"></h2><button class="icon-btn" type="button" data-close="entry-overlay" aria-label="Close">&times;</button></div>
      <div class="strip"><div><span class="strip-lbl">Subtotal</span><span class="strip-sub" id="entry-count"></span></div><strong class="num" id="entry-subtotal">₹0</strong></div>
    </div>
    <div class="sheet-body" id="entry-body"></div>
    <div class="sheet-foot">
      <button class="btn btn-soft" id="entry-reset" type="button">Reset</button>
      <button class="btn btn-primary" type="button" data-close="entry-overlay">✓ Done</button>
    </div>
  </div>
</div>

<!-- Summary sheet -->
<div class="overlay" id="summary-overlay">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="summary-title">
    <div class="grab"></div>
    <div class="sheet-head">
      <div class="head-row"><h2 id="summary-title">Summary</h2><button class="icon-btn" type="button" data-close="summary-overlay" aria-label="Close">&times;</button></div>
      <p class="summary-date" id="summary-date"></p>
    </div>
    <div class="sheet-body">
      <ul class="list" id="place-sum"></ul>
      <div class="grand"><span>Total</span><span class="num" id="grand-total">₹0</span></div>
      <h3 class="sub-h">Denomination breakdown</h3>
      <ul class="list breakdown" id="combined-list"></ul>
    </div>
    <div class="sheet-foot">
      <button class="btn btn-soft" id="copy-btn" type="button">Copy</button>
      <button class="btn btn-wa" id="send-btn" type="button">Send to Father on WhatsApp</button>
    </div>
  </div>
</div>

<!-- Confirm clear -->
<div class="overlay center" id="confirm-overlay">
  <div class="sheet confirm" role="alertdialog" aria-modal="true" aria-labelledby="confirm-title">
    <h2 id="confirm-title">Clear all entries?</h2>
    <p>Every place will be reset to zero. You can undo right after.</p>
    <div class="row">
      <button class="btn btn-soft" type="button" data-close="confirm-overlay">Cancel</button>
      <button class="btn btn-danger" id="confirm-clear" type="button">Clear all</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
'use strict';

/* ---------- Config ---------- */
const DENOMS = [500, 200, 100, 50, 20, 10];
const CHIPS  = [-100, -10, -1, 1, 10, 100];
const PLACES = [
  { id: 'home',    label: 'Home',          icon: '🏠' },
  { id: 'office',  label: 'Office',        icon: '🏢' },
  { id: 'morning', label: 'Morning Shift', icon: '🌅' },
  { id: 'evening', label: 'Evening Shift', icon: '🌇' }
];
const CFG = { phone: '919088086294', key: 'cashCalc:v4', max: 99999 };

/* ---------- Helpers ---------- */
const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2, '0');
const today = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const fmt = n => '₹' + n.toLocaleString('en-IN');
const readable = s => new Date(s + 'T00:00:00').toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' });
const plural = n => `${n} ${n === 1 ? 'note' : 'notes'}`;
const buzz = () => { try { navigator.vibrate && navigator.vibrate(8); } catch (e) {} };
const emptyQty = () => Object.fromEntries(PLACES.map(p => [p.id, Object.fromEntries(DENOMS.map(d => [d, 0]))]));

/* ---------- State (local date, so IST mornings never show yesterday) ---------- */
function load() {
  try {
    const s = JSON.parse(localStorage.getItem(CFG.key) || 'null');
    if (s && s.qty && s.savedOn === today()) return s;
  } catch (e) {}
  return { date: today(), savedOn: today(), qty: emptyQty() };
}
let state = load();
const save = () => { state.savedOn = today(); try { localStorage.setItem(CFG.key, JSON.stringify(state)); } catch (e) {} };

const qtyOf = (id, d) => (state.qty[id] && state.qty[id][d]) || 0;
const subtotal = id => DENOMS.reduce((s, d) => s + qtyOf(id, d) * d, 0);
const noteCount = id => DENOMS.reduce((s, d) => s + qtyOf(id, d), 0);
function totals() {
  const combined = {};
  DENOMS.forEach(d => combined[d] = PLACES.reduce((s, p) => s + qtyOf(p.id, d), 0));
  return {
    combined,
    grand: PLACES.reduce((s, p) => s + subtotal(p.id), 0),
    notes: DENOMS.reduce((s, d) => s + combined[d], 0)
  };
}

/* ---------- Toast with optional undo ---------- */
let toastTimer;
function hideToast() { $('#toast').classList.remove('show'); }
function toast(msg, undo) {
  const t = $('#toast');
  t.textContent = '';
  const s = document.createElement('span'); s.textContent = msg; t.append(s);
  if (undo) {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'toast-undo'; b.textContent = 'Undo';
    b.onclick = () => { undo(); hideToast(); };
    t.append(b);
  }
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(hideToast, undo ? 7000 : 2200);
}
const snap = () => JSON.stringify(state.qty);
function restore(s) {
  state.qty = JSON.parse(s); save(); renderHome();
  if (current && $('#entry-overlay').classList.contains('open')) openEntry(current);
}

/* ---------- Home ---------- */
function renderHome() {
  const t = totals();
  $('#place-list').innerHTML = PLACES.map(p => {
    const n = noteCount(p.id);
    return `<button type="button" class="place" data-id="${p.id}">
      <span class="badge">${p.icon}</span>
      <span class="place-text"><span class="place-name">${p.label}</span><span class="place-sub">${n ? plural(n) : 'Tap to add notes'}</span></span>
      <span class="place-amt num">${fmt(subtotal(p.id))}</span><span class="chev" aria-hidden="true">›</span>
    </button>`;
  }).join('');
  $('#hero-total').textContent = fmt(t.grand);
  $('#hero-meta').textContent = plural(t.notes);
}

/* ---------- Entry sheet ---------- */
let current = null;

function openEntry(id) {
  current = id;
  const p = PLACES.find(x => x.id === id);
  $('#entry-title').textContent = `${p.icon} ${p.label}`;
  $('#entry-body').innerHTML = DENOMS.map(d => `
    <div class="denom" data-d="${d}">
      <div class="denom-top">
        <span class="note num">₹${d}</span><span class="x" aria-hidden="true">×</span>
        <input class="qty num" type="number" inputmode="numeric" min="0" max="${CFG.max}" placeholder="0"
          aria-label="Number of ₹${d} notes" value="${qtyOf(id, d) || ''}">
        <span class="d-amt num"></span>
      </div>
      <div class="chips">${CHIPS.map(s =>
        `<button type="button" class="chip ${s < 0 ? 'minus' : 'plus'}" data-s="${s}" aria-label="${s < 0 ? 'Remove' : 'Add'} ${Math.abs(s)} of ₹${d}">${s < 0 ? '−' : '+'}${Math.abs(s)}</button>`
      ).join('')}</div>
    </div>`).join('');
  DENOMS.forEach(d => syncRow(d, false));
  syncSubtotal();
  openOverlay('entry-overlay');
}

function syncRow(d, writeInput) {
  const row = $(`#entry-body .denom[data-d="${d}"]`);
  if (!row) return;
  const q = qtyOf(current, d);
  row.querySelector('.d-amt').textContent = fmt(q * d);
  row.querySelectorAll('.chip.minus').forEach(b => b.disabled = q === 0);
  if (writeInput) row.querySelector('.qty').value = q || '';
}
function syncSubtotal() {
  $('#entry-subtotal').textContent = fmt(subtotal(current));
  $('#entry-count').textContent = plural(noteCount(current));
}
function setQty(d, v, writeInput) {
  v = Math.min(CFG.max, Math.max(0, Number.isFinite(v) ? v : 0));
  state.qty[current][d] = v;
  syncRow(d, writeInput); syncSubtotal(); save(); renderHome();
}

const body = $('#entry-body');
body.addEventListener('click', e => {
  const c = e.target.closest('.chip');
  if (!c || c.disabled) return;
  const d = +c.closest('.denom').dataset.d;
  setQty(d, qtyOf(current, d) + (+c.dataset.s), true);
  buzz();
});
body.addEventListener('input', e => {
  if (!e.target.matches('.qty')) return;
  const d = +e.target.closest('.denom').dataset.d;
  const v = parseInt(e.target.value, 10) || 0;
  setQty(d, v, v < 0 || v > CFG.max);
});
body.addEventListener('focusin', e => { if (e.target.matches('.qty')) e.target.select(); });

$('#entry-reset').addEventListener('click', () => {
  if (!noteCount(current)) { toast('Nothing to reset'); return; }
  const s = snap();
  DENOMS.forEach(d => state.qty[current][d] = 0);
  save(); renderHome(); openEntry(current);
  toast('Place reset', () => restore(s));
});

/* ---------- Overlays ---------- */
const openOverlay = id => $('#' + id).classList.add('open');
const closeOverlay = id => $('#' + id).classList.remove('open');
document.addEventListener('click', e => {
  const c = e.target.closest('[data-close]');
  if (c) closeOverlay(c.dataset.close);
  else if (e.target.classList.contains('overlay')) closeOverlay(e.target.id);
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  const o = [...document.querySelectorAll('.overlay.open')].pop();
  if (o) closeOverlay(o.id);
});

/* ---------- Summary + sharing ---------- */
function renderSummary() {
  const t = totals();
  $('#summary-date').textContent = readable(state.date);
  $('#place-sum').innerHTML = PLACES.map(p =>
    `<li><span>${p.icon} ${p.label}</span><span class="num">${fmt(subtotal(p.id))}</span></li>`).join('');
  $('#grand-total').textContent = fmt(t.grand);
  $('#combined-list').innerHTML = DENOMS.filter(d => t.combined[d]).map(d =>
    `<li><span class="num">₹${d} × ${t.combined[d]}</span><span class="num">${fmt(d * t.combined[d])}</span></li>`).join('')
    || '<li class="empty">No cash entered yet</li>';
  $('#send-btn').disabled = $('#copy-btn').disabled = !t.grand;
}

function buildMessage() {
  const t = totals();
  const L = [`*Cash Deposit – ${readable(state.date)}*`, ''];
  PLACES.forEach(p => L.push(`${p.label}: ${fmt(subtotal(p.id))}`));
  L.push('', `*Total: ${fmt(t.grand)}*`);
  const rows = DENOMS.filter(d => t.combined[d]).map(d => `₹${d} × ${t.combined[d]} = ${fmt(d * t.combined[d])}`);
  if (rows.length) L.push('', '_Denomination breakdown:_', ...rows);
  return L.join('\n');
}

$('#place-list').addEventListener('click', e => {
  const b = e.target.closest('.place');
  if (b) openEntry(b.dataset.id);
});
$('#review-btn').addEventListener('click', () => { renderSummary(); openOverlay('summary-overlay'); });

$('#send-btn').addEventListener('click', () => {
  const url = `https://wa.me/${CFG.phone}?text=${encodeURIComponent(buildMessage())}`;
  if (!window.open(url, '_blank')) location.href = url;
});
$('#copy-btn').addEventListener('click', async () => {
  const m = buildMessage();
  try { await navigator.clipboard.writeText(m); }
  catch (e) {
    const ta = document.createElement('textarea');
    ta.value = m; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); } catch (_) {}
    ta.remove();
  }
  toast('Summary copied');
});

/* ---------- Clear all (confirm + undo) ---------- */
$('#reset-btn').addEventListener('click', () => {
  if (!totals().notes) { toast('Nothing to clear'); return; }
  openOverlay('confirm-overlay');
});
$('#confirm-clear').addEventListener('click', () => {
  const s = snap();
  state.qty = emptyQty(); save(); renderHome();
  closeOverlay('confirm-overlay');
  toast('All entries cleared', () => restore(s));
});

/* ---------- Date ---------- */
$('#date-input').addEventListener('change', e => { state.date = e.target.value || today(); e.target.value = state.date; save(); });

/* ---------- Init ---------- */
$('#date-input').value = state.date;
renderHome();
})();
</script>
</body>
</html>

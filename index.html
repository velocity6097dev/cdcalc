<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cash Deposit Calculator</title>
<style>
  :root{
    --page-bg:#DCE8F0;
    --bg:#EAF4FB; --surface:#FFFFFF; --ink:#0B2436; --ink-soft:#4C6B80;
    --blue:#007BC9; --yellow:#FFE000; --line:#CFE4F2;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --page-bg:#04131F;
      --bg:#071722; --surface:#0E2538; --ink:#EAF4FB; --ink-soft:#9FC3DA;
      --blue:#3DA5E8; --yellow:#FFE000; --line:#1C3C52;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --page-bg:#04131F;
    --bg:#071722; --surface:#0E2538; --ink:#EAF4FB; --ink-soft:#9FC3DA;
    --blue:#3DA5E8; --yellow:#FFE000; --line:#1C3C52;
    color-scheme: dark;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--page-bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  button{touch-action:manipulation; user-select:none; font-family:inherit;}
  .app{max-width:430px;margin:0 auto;min-height:100vh;background:var(--bg);
    display:flex;flex-direction:column;
    padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
  @media (min-width:431px){
    body{display:flex;justify-content:center;padding:28px 12px;}
    .app{min-height:auto;border-radius:30px;overflow:hidden;box-shadow:0 24px 70px rgba(0,40,70,.28);}
  }
  .appbar{background:var(--blue);color:#fff;padding:18px 18px 16px;
    box-shadow:0 4px 14px rgba(0,40,70,.18);position:relative;z-index:2;}
  .appbar-row{display:flex;justify-content:space-between;align-items:center;}
  h1{margin:0;font-family:Georgia,"Iowan Old Style",serif;font-size:21px;font-weight:600;letter-spacing:.2px;}
  .clear-btn{display:flex;align-items:center;gap:5px;background:rgba(255,255,255,.16);
    border:none;color:#fff;font-size:13px;font-weight:700;padding:8px 14px;
    border-radius:999px;cursor:pointer;}
  .clear-btn:active{background:rgba(255,255,255,.3);}
  .date-row{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:13px;color:#D7ECFA;}
  input[type=date]{border:none;border-radius:999px;padding:7px 13px;font-size:15px;
    background:rgba(255,255,255,.18);color:#fff;font-family:inherit;font-weight:600;}
  input[type=date]::-webkit-calendar-picker-indicator{filter:invert(1);}
  main{flex:1;}
  .place-row{display:flex;align-items:center;justify-content:space-between;
    min-height:62px;padding:12px 18px;border-bottom:1px solid var(--line);background:none;
    border-left:none;border-right:none;border-top:none;width:100%;text-align:left;
    cursor:pointer;color:var(--ink);}
  .place-row:active{background:rgba(0,123,201,.07);}
  .place-left{display:flex;align-items:center;gap:13px;}
  .icon-badge{width:44px;height:44px;border-radius:50%;background:rgba(0,123,201,.12);
    display:flex;align-items:center;justify-content:center;font-size:21px;flex-shrink:0;}
  .place-row .name{font-size:15.5px;font-weight:600;}
  .place-row .sub{font-size:12.5px;color:var(--ink-soft);margin-top:2px;}
  .place-row .amt{font-weight:700;color:var(--blue);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-variant-numeric:tabular-nums;font-size:17px;}
  .cta-bar{padding:14px 18px;background:var(--surface);border-top:1px solid var(--line);
    box-shadow:0 -4px 14px rgba(0,40,70,.08);padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));}
  #review-btn{width:100%;padding:16px;border:none;border-radius:13px;background:var(--yellow);
    color:#05263B;font-weight:800;font-size:16px;cursor:pointer;min-height:52px;}
  #review-btn:active{transform:scale(.98);}

  .overlay{position:fixed;inset:0;background:rgba(5,30,50,.52);display:none;
    align-items:flex-end;justify-content:center;z-index:50;}
  .overlay.open{display:flex;}
  .sheet{background:var(--surface);width:100%;max-width:430px;max-height:88vh;overflow-y:auto;
    border-radius:20px 20px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));
    box-shadow:0 -10px 30px rgba(0,0,0,.2);}
  .sheet-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
  .sheet-header h2{margin:0;font-size:18px;font-weight:700;}
  .close-btn{background:var(--bg);border:none;font-size:20px;line-height:1;color:var(--ink-soft);
    cursor:pointer;width:32px;height:32px;border-radius:50%;}

  .entry-subtotal-row{display:flex;justify-content:space-between;align-items:baseline;
    background:var(--bg);border-radius:12px;padding:12px 14px;margin-bottom:14px;font-weight:700;}
  #entry-subtotal{color:var(--blue);font-size:21px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;}

  .denom-row{background:var(--bg);border:1px solid var(--line);border-radius:13px;padding:12px;margin-bottom:10px;}
  .denom-row-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;}
  .denom-label{font-weight:700;font-size:16px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;width:58px;flex-shrink:0;}
  .qty-input{width:62px;text-align:center;font-size:16px;padding:8px 4px;border:1px solid var(--line);
    border-radius:9px;background:var(--surface);color:var(--ink);font-family:inherit;-moz-appearance:textfield;}
  .qty-input::-webkit-outer-spin-button,.qty-input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
  .row-amt{font-weight:700;color:var(--blue);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-size:15px;flex:1;text-align:right;font-variant-numeric:tabular-nums;}
  .stepper-row{display:flex;gap:7px;}
  .step-btn{flex:1;padding:10px 0;border:none;border-radius:9px;background:var(--blue);color:#fff;
    font-weight:700;font-size:13.5px;cursor:pointer;min-height:42px;transition:transform .05s;}
  .step-btn:active{transform:scale(.95);opacity:.85;}
  .done-btn{width:100%;margin-top:8px;padding:14px;border:none;border-radius:11px;
    background:var(--yellow);color:#05263B;font-weight:800;font-size:15px;cursor:pointer;min-height:48px;}
  .done-btn:active{transform:scale(.98);}

  .summary-date{color:var(--ink-soft);font-size:13px;margin:0 0 14px;}
  .place-sum{list-style:none;margin:0 0 6px;padding:0;}
  .place-sum li{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px;}
  .grand-row{display:flex;justify-content:space-between;align-items:baseline;padding:14px 0;
    border-top:2px solid var(--ink);margin-bottom:16px;}
  .grand-row span:first-child{font-weight:700;font-size:16px;}
  .grand-row span:last-child{font-weight:800;font-size:25px;color:var(--blue);
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;}
  h3.denom-h{font-size:13px;color:var(--ink-soft);margin:0 0 8px;font-weight:600;}
  .denom-list{list-style:none;margin:0 0 18px;padding:0;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:14px;}
  .denom-list li{display:flex;justify-content:space-between;padding:4px 0;color:var(--ink-soft);font-variant-numeric:tabular-nums;}
  #send-btn{width:100%;padding:16px;border:none;border-radius:13px;background:var(--yellow);
    color:#05263B;font-weight:800;font-size:16px;cursor:pointer;min-height:52px;}
  #send-btn:active{transform:scale(.98);}
</style>
</head>
<body>
<div class="app">
  <header class="appbar">
    <div class="appbar-row">
      <h1>Cash Deposit</h1>
      <button id="reset-btn" class="clear-btn" type="button">↺ Clear</button>
    </div>
    <div class="date-row">
      <label for="date-input">Date</label>
      <input type="date" id="date-input">
    </div>
  </header>

  <main>
    <div id="place-list"></div>
  </main>

  <div class="cta-bar">
    <button id="review-btn" type="button">🧾 Review &amp; Send</button>
  </div>
</div>

<div class="overlay" id="entry-overlay">
  <div class="sheet">
    <div class="sheet-header">
      <h2 id="entry-title">Home</h2>
      <button class="close-btn" type="button" data-close="entry-overlay">&times;</button>
    </div>
    <div class="entry-subtotal-row">
      <span>Subtotal</span>
      <span id="entry-subtotal">₹0</span>
    </div>
    <div id="entry-body"></div>
    <button class="done-btn" type="button" data-close="entry-overlay">✓ Done</button>
  </div>
</div>

<div class="overlay" id="summary-overlay">
  <div class="sheet">
    <div class="sheet-header">
      <h2>Summary</h2>
      <button class="close-btn" type="button" data-close="summary-overlay">&times;</button>
    </div>
    <p class="summary-date" id="summary-date"></p>
    <ul class="place-sum" id="place-sum-list"></ul>
    <div class="grand-row">
      <span>Total</span>
      <span id="grand-total">₹0</span>
    </div>
    <h3 class="denom-h">Denomination breakdown (all places combined)</h3>
    <ul id="combined-list" class="denom-list"></ul>
    <button id="send-btn" type="button">📲 Send to Father on WhatsApp</button>
  </div>
</div>

<script>
const DENOMS = [500,200,100,50,20,10];
const PLACES = [
  ['home','Home','🏠'],
  ['office','Office','🏢'],
  ['morning','Morning Shift','🌅'],
  ['evening','Evening Shift','🌇']
];
const PHONE = '919088086294';
const STORE_KEY = 'cashCalc:v3';

function todayStr(){ return new Date().toISOString().slice(0,10); }
function fmt(n){ return '₹' + n.toLocaleString('en-IN'); }
function formatDateReadable(dstr){
  const d = new Date(dstr + 'T00:00:00');
  return d.toLocaleDateString('en-IN', { day:'2-digit', month:'short', year:'numeric' });
}
function emptyQty(){
  const qty = {};
  PLACES.forEach(([id]) => { qty[id] = {}; DENOMS.forEach(d => qty[id][d]=0); });
  return qty;
}

function loadState(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw){
      const s = JSON.parse(raw);
      if(s && s.qty){
        if(s.date !== todayStr()){
          return { date: todayStr(), qty: emptyQty() };
        }
        return s;
      }
    }
  }catch(e){}
  return { date: todayStr(), qty: emptyQty() };
}
function saveState(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){} }

let state = loadState();

function placeSubtotal(id){
  return DENOMS.reduce((s,d) => s + (state.qty[id][d]||0) * d, 0);
}

function renderPlaceList(){
  const root = document.getElementById('place-list');
  root.innerHTML = PLACES.map(([id,label,icon]) => `
    <button type="button" class="place-row" data-place="${id}">
      <span class="place-left">
        <span class="icon-badge">${icon}</span>
        <span>
          <div class="name">${label}</div>
          <div class="sub">Tap to enter notes</div>
        </span>
      </span>
      <span class="amt">${fmt(placeSubtotal(id))}</span>
    </button>`).join('');
  root.querySelectorAll('.place-row').forEach(btn => {
    btn.addEventListener('click', () => openEntry(btn.dataset.place));
  });
}

function updateEntrySubtotal(placeId){
  document.getElementById('entry-subtotal').textContent = fmt(placeSubtotal(placeId));
}

function openEntry(placeId){
  const [, label, icon] = PLACES.find(p => p[0] === placeId);
  document.getElementById('entry-title').textContent = `${icon} ${label}`;
  const body = document.getElementById('entry-body');
  body.innerHTML = DENOMS.map(d => `
    <div class="denom-row" data-denom="${d}">
      <div class="denom-row-top">
        <div class="denom-label">₹${d}</div>
        <input type="number" inputmode="numeric" min="0" class="qty-input" id="q-${d}"
          value="${state.qty[placeId][d] || ''}">
        <div class="row-amt" id="a-${d}">${fmt((state.qty[placeId][d]||0)*d)}</div>
      </div>
      <div class="stepper-row">
        <button type="button" class="step-btn" data-denom="${d}" data-step="1">+1</button>
        <button type="button" class="step-btn" data-denom="${d}" data-step="10">+10</button>
        <button type="button" class="step-btn" data-denom="${d}" data-step="100">+100</button>
      </div>
    </div>`).join('');

  function refreshRow(d){
    const q = state.qty[placeId][d] || 0;
    document.getElementById(`a-${d}`).textContent = fmt(q * d);
    updateEntrySubtotal(placeId);
    saveState();
    renderPlaceList();
  }

  body.querySelectorAll('.qty-input').forEach(inp => {
    inp.addEventListener('input', () => {
      let v = parseInt(inp.value, 10);
      if(isNaN(v) || v < 0) v = 0;
      const d = inp.id.split('-')[1];
      state.qty[placeId][d] = v;
      refreshRow(d);
    });
  });
  body.querySelectorAll('.step-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const d = btn.dataset.denom, step = parseInt(btn.dataset.step, 10);
      state.qty[placeId][d] = (state.qty[placeId][d] || 0) + step;
      document.getElementById(`q-${d}`).value = state.qty[placeId][d];
      refreshRow(d);
    });
  });

  updateEntrySubtotal(placeId);
  openOverlay('entry-overlay');
}

function openOverlay(id){ document.getElementById(id).classList.add('open'); }
function closeOverlay(id){ document.getElementById(id).classList.remove('open'); }

document.querySelectorAll('[data-close]').forEach(btn => {
  btn.addEventListener('click', () => closeOverlay(btn.dataset.close));
});
document.querySelectorAll('.overlay').forEach(ov => {
  ov.addEventListener('click', (e) => { if(e.target === ov) closeOverlay(ov.id); });
});

function renderSummary(){
  const combined = {}; DENOMS.forEach(d => combined[d] = 0);
  let grand = 0;
  const placeHtml = PLACES.map(([id,label,icon]) => {
    const subtotal = placeSubtotal(id);
    DENOMS.forEach(d => combined[d] += (state.qty[id][d]||0));
    grand += subtotal;
    return `<li><span>${icon} ${label}</span><span>${fmt(subtotal)}</span></li>`;
  }).join('');
  document.getElementById('place-sum-list').innerHTML = placeHtml;
  document.getElementById('grand-total').textContent = fmt(grand);
  document.getElementById('summary-date').textContent = formatDateReadable(state.date);
  const denomHtml = DENOMS.filter(d => combined[d] > 0)
    .map(d => `<li><span>₹${d} × ${combined[d]}</span><span>${fmt(d*combined[d])}</span></li>`).join('');
  document.getElementById('combined-list').innerHTML = denomHtml || '<li><span>No cash entered yet</span><span></span></li>';
  return { combined, grand };
}

document.getElementById('review-btn').addEventListener('click', () => {
  renderSummary();
  openOverlay('summary-overlay');
});

function buildMessage(){
  const { combined, grand } = renderSummary();
  const lines = [];
  lines.push(`*Cash Deposit – ${formatDateReadable(state.date)}*`, '');
  PLACES.forEach(([id,label]) => lines.push(`${label}: ${fmt(placeSubtotal(id))}`));
  lines.push('', `*Total: ${fmt(grand)}*`);
  const denomLines = DENOMS.filter(d => combined[d] > 0)
    .map(d => `₹${d} × ${combined[d]} = ${fmt(d*combined[d])}`);
  if(denomLines.length) lines.push('', '_Denomination breakdown:_', ...denomLines);
  return lines.join('\n');
}

document.getElementById('send-btn').addEventListener('click', () => {
  const msg = buildMessage();
  window.open(`https://wa.me/${PHONE}?text=${encodeURIComponent(msg)}`, '_blank');
});

document.getElementById('reset-btn').addEventListener('click', () => {
  state.qty = emptyQty();
  saveState();
  renderPlaceList();
});

document.getElementById('date-input').addEventListener('change', (e) => {
  state.date = e.target.value || todayStr();
  saveState();
});

document.getElementById('date-input').value = state.date || todayStr();
renderPlaceList();
</script>
</body>
</html>
